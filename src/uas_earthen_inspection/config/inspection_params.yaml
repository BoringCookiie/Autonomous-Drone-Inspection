/**:
  ros__parameters:
    # Sensor Topics & Frames
    camera_rgb_topic: "/camera/color/image_raw"
    camera_depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    setpoint_topic: "/uas1/setpoint_position/local"
    pose_topic: "/uas1/local_position/pose"
    waypoint_reached_topic: "/uav/waypoint_reached"
    captured_frame_topic: "/inspection/captured_frame"
    save_captured_frames: true
    output_dir: "/home/uas/rosbags/inspection_frames"
    detections_topic: "/inspection/detections"
    revisit_waypoints_topic: "/planner/revisit_waypoints"
    uav_pose_topic: "/uas1/local_position/pose"

    # Execution Parameters (Launch matrix configuration)
    detector_backend: "rag_vlm" # Options: raw_vlm | rag_vlm | yolo
    flight_strategy: "revisit"  # Options: single_pass | revisit

    # Defect Ambiguity Band Parameters
    confidence_ambiguity_min: 0.4
    confidence_ambiguity_max: 0.7

    # Revisit Flight Distance Math (D_revisit = max(D_min, D_base - k * (1 - C)))
    d_base: 3.0   # Nominal standoff distance in meters
    d_min: 1.0    # Minimum safe clearance distance in meters
    k_standoff: 2.0 # Scaling factor for confidence uncertainty

    # Camera Intrinsics Parameters — x500_depth SDF model
    # Derived from: hFOV = 1.204 rad, image 640x480
    #   vFOV = 2 * atan(tan(hFOV/2) * (height/width)) = 2 * atan(tan(0.602) * 0.75)
    #   fy   = (height/2) / tan(vFOV/2) = 240 / tan(0.4517) ≈ 381.36
    #   fx   = (width/2)  / tan(hFOV/2) = 320 / tan(0.602)  ≈ 381.36  (square pixels)
    # NOTE: real values are latched at runtime from /camera/color/camera_info if available
    fx: 381.36
    fy: 381.36
    cx: 320.0
    cy: 240.0
    image_width: 640
    image_height: 480

    # Knowledge Base & Model Paths
    ontology_json_path: "knowledge_base/defect_ontology.json"
    prompts_yaml_path: "knowledge_base/prompts.yaml"
    clip_embeddings_path: "models/embeddings/clip_kb_embeddings.pt"
    yolo_weights_path: "models/yolo/yolo_earthen_v11.pt"
